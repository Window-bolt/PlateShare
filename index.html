<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlateShare - Street Kiosk Prototype</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .kiosk-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 20px;
            font-size: 18px;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #219653;
        }
        .btn-family {
            background-color: #2980b9;
        }
        .btn-family:hover {
            background-color: #1f618d;
        }
        #status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .alert-success {
            background-color: #e8f8f5;
            color: #117a65;
            border: 1px solid #a3e4d7;
        }
    </style>
</head>
<body>

    <div class="kiosk-container">
        <h1>PlateShare</h1>
        <p class="subtitle">Tap below to request surplus fresh food nearby</p>

        <button class="btn" onclick="requestFood('Single Meal')">🍽️ Request Meal (1 Person)</button>
        <button class="btn btn-family" onclick="requestFood('Family Pack')">👨‍👩‍👧 Request Meal (Family)</button>

        <div id="status-box"></div>
    </div>

    <script>
        function requestFood(mealType) {
            const statusBox = document.getElementById('status-box');
            
            // Simulating GPS location grab
            const mockLat = "12.9716° N";
            const mockLong = 77.5946° " E"; // Simplified display string
            
            statusBox.style.display = 'block';
            statusBox.className = 'alert-success';
            statusBox.innerHTML = `<strong>Request Sent Successfully!</strong><br>Type: ${mealType}<br>📍 GPS Location Shared with Nearby Donors.<br><em>Estimated food pickup/delivery: 15 mins.</em>`;
        }
    </script>

</body>
</html>
